<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>

    <!-- Cylinder / Disc Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Subtle Outer Border Stroke -->
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#253554" stroke-width="2" opacity="0.6"/>

  <g transform="translate(4, 0)">
    <!-- Bottom DB Layer -->
    <path d="M140 330 C140 365 372 365 372 330 L372 360 C372 395 140 395 140 360 Z" fill="#152037"/>
    <ellipse cx="256" cy="330" rx="116" ry="26" fill="#1C2B4B" stroke="#2D4375" stroke-width="3"/>

    <!-- Middle DB Layer -->
    <path d="M140 255 C140 290 372 290 372 255 L372 285 C372 320 140 320 140 285 Z" fill="#1A2744"/>
    <ellipse cx="256" cy="255" rx="116" ry="26" fill="#22365F" stroke="url(#cyanGrad)" stroke-width="3"/>

    <!-- Top Chat-Morph Layer -->
    <g filter="url(#softGlow)">
      <path d="M140 175 C140 140 372 140 372 175 C372 210 180 210 140 230 C150 205 140 185 140 175 Z" fill="url(#cyanGrad)"/>
      <ellipse cx="256" cy="170" rx="116" ry="25" fill="#38BDF8" opacity="0.9"/>
    </g>

    <!-- Eyes -->
    <circle cx="218" cy="168" r="6" fill="#0B132B"/>
    <circle cx="294" cy="168" r="6" fill="#0B132B"/>

    <!-- Highlights -->
    <circle cx="216" cy="166" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="292" cy="166" r="2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Spark Stars -->
    <path d="M375 120 Q390 120 390 105 Q390 120 405 120 Q390 120 390 135 Q390 120 375 120 Z" fill="#38BDF8" filter="url(#softGlow)"/>
    <path d="M125 150 Q135 150 135 140 Q135 150 145 150 Q135 150 135 160 Q135 150 125 150 Z" fill="#00F2FE" opacity="0.8"/>
  </g>
</svg>
